<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Payment successful</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="phone">
      <main class="success">
        <div id="success-card" class="success-card">
          <div class="success-mark" aria-hidden="true">✓</div>
          <h1 id="success-title">Checking payment…</h1>
          <p id="success-copy" class="lede">Please wait a moment.</p>
          <dl class="receipt" id="receipt" hidden></dl>
          <a class="primary-btn" href="/">Back to store</a>
        </div>
      </main>
    </div>
    <script src="/js/success.js"></script>
  </body>
</html>
